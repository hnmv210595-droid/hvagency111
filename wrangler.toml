name = "hvagency111"
compatibility_date = "2025-03-01"
main = "worker/index.ts"
compatibility_flags = ["nodejs_compat"]

[assets]
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "hv-agency"
database_id = "696b58d1-61f6-4eb4-9b93-b33587bef7c9"
migrations_dir = "migrations"

[vars]
COMPANY_IP = "115.76.54.149"
SESSION_TTL_HOURS = "24"
LOGIN_RATE_LIMIT = "10"
LOGIN_RATE_WINDOW_MINUTES = "15"
TIMEZONE = "Asia/Ho_Chi_Minh"
CURRENCY = "VNĐ"

# Cron: 01:00 UTC on day 1 ≈ 08:00 Asia/Ho_Chi_Minh — send previous month payroll
[triggers]
crons = ["0 1 1 * *"]

# Production secrets (do not commit):
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put ADMIN_PASSWORD
# Optional: npx wrangler secret put ADMIN_USERNAME  (default Admin111)
# Telegram (2 bots + 1 fixed group):
#   npx wrangler secret put TELEGRAM_SEND_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_RECEIVE_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
# Optional: npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
